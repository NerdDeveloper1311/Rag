<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Spring AI RAG 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #chatArea {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
    }
    .chat-bubble {
      margin-bottom: 10px;
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user-bubble {
      background-color: #0d6efd;
      color: white;
      margin-left: auto;
    }
    .ai-bubble {
      background-color: #e9ecef;
      color: black;
      margin-right: auto;
    }
  </style>
</head>
<body class="container py-5">

<div class="row justify-content-center">
  <div class="col-md-8">
    <h2 class="mb-4 text-center">📚 PDF RAG 시스템 Dashboard</h2>

    <div class="card mb-4">
      <div class="card-header bg-primary text-white">PDF 문서 업로드 및 임베딩</div>
      <div class="card-body">
        <form id="uploadForm">
          <div class="input-group">
            <input type="file" class="form-control" id="pdfFile" accept=".pdf" required>
            <button class="btn btn-outline-primary" type="submit" id="uploadBtn">업로드 및 분석</button>
          </div>
        </form>
        <div id="uploadStatus" class="mt-2 small text-muted"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-dark text-white">문서 기반 질의응답 (Ollama & ES)</div>
      <div class="card-body">
        <div id="chatArea" class="mb-3 d-flex flex-column"></div>

        <div class="input-group">
          <input type="text" id="queryInput" class="form-control" placeholder="질문을 입력하세요..." onkeydown="if(event.keyCode==13) sendQuery()">
          <button class="btn btn-success" type="button" onclick="sendQuery()">전송</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // PDF 업로드 처리
  document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const fileInput = document.getElementById('pdfFile');
    const statusDiv = document.getElementById('uploadStatus');
    const uploadBtn = document.getElementById('uploadBtn');

    if (fileInput.files.length === 0) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    statusDiv.innerText = "PDF 분석 및 임베딩 중... 잠시만 기다려주세요.";
    statusDiv.className = "mt-2 small text-primary";
    uploadBtn.disabled = true;

    fetch('/upload', {
      method: 'POST',
      body: formData
    })
            .then(response => response.text())
            .then(data => {
              statusDiv.innerText = data;
              statusDiv.className = "mt-2 small text-success";
              fileInput.value = '';
            })
            .catch(error => {
              console.error('Error:', error);
              statusDiv.innerText = "업로드 실패: 서버 에러 발생";
              statusDiv.className = "mt-2 small text-danger";
            })
            .finally(() => {
              uploadBtn.disabled = false;
            });
  });

  // SSE 기반 채팅 전송 처리
  function sendQuery() {
    const queryInput = document.getElementById('queryInput');
    const chatArea = document.getElementById('chatArea');
    const query = queryInput.value.trim();

    if (!query) return;

    // 1. 사용자 말풍선 추가
    const userBubble = document.createElement('div');
    userBubble.className = 'chat-bubble user-bubble';
    userBubble.innerText = query;
    chatArea.appendChild(userBubble);
    queryInput.value = '';
    chatArea.scrollTop = chatArea.scrollHeight;

    // 2. AI 답변용 빈 말풍선 먼저 생성
    const aiBubble = document.createElement('div');
    aiBubble.className = 'chat-bubble ai-bubble';
    aiBubble.innerText = '답변 생성중...';
    chatArea.appendChild(aiBubble);
    chatArea.scrollTop = chatArea.scrollHeight;

    let isFirst = true;

    // 3. EventSource를 이용한 SSE 연결
    const eventSource = new EventSource(`/chat?query=${encodeURIComponent(query)}`);

    eventSource.onmessage = function(event) {
      if (isFirst) {
        aiBubble.innerText = ''; // 초기화
        isFirst = false;
      }

      // 서비스 레이어의 [SPACE] 치환 기호를 다시 공백으로 변환
      let chunk = event.data.replace(/\[SPACE\]/g, ' ');
      aiBubble.innerText += chunk;
      chatArea.scrollTop = chatArea.scrollHeight;
    };

    eventSource.onerror = function(err) {
      // 스트림 완료 혹은 에러 시 연결 종료
      eventSource.close();
      if(isFirst) {
        aiBubble.innerText = "답변을 가져오는 중 오류가 발생했거나 문서에서 정보를 찾을 수 없습니다.";
      }
    };
  }
</script>
</body>
</html>
