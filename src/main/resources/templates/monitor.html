<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서버 및 GPU 자원 모니터링</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding-top: 20px; padding-bottom: 20px; }
    .card { margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 10px; }
    .card-header { font-weight: bold; border-top-left-radius: 10px !important; border-top-right-radius: 10px !important; }
    /* 반응형 폰트 및 여백 미세 조정을 위한 커스텀 CSS */
    @media (max-width: 576px) {
      h1 { font-size: 1.5rem !important; }
      .card-title { font-size: 1rem !important; }
    }
  </style>
</head>
<body>

<div class="container-fluid px-4" style="max-width: 1400px;">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-2">
    <h1 class="text-dark m-0 fw-bold">🖥️ 통합 서버 자원 모니터링</h1>
    <span class="badge bg-secondary p-2 fs-6" id="refresh-timer">5초 후 갱신</span>
  </div>

  <div class="row">
    <div class="col-12 col-md-6">
      <div class="card border-primary h-100">
        <div class="card-header bg-primary text-white">⚙️ CPU Usage</div>
        <div class="card-body d-flex flex-column justify-content-center">
          <h5 class="card-title mb-3">시스템 CPU 사용률: <span class="fw-bold text-primary" th:text="${metrics.systemCpu}">0</span>%</h5>
          <div class="progress" style="height: 20px;">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                 role="progressbar" th:style="'width: ' + ${metrics.systemCpu} + '%'"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 mt-3 mt-md-0">
      <div class="card border-info h-100">
        <div class="card-header bg-info text-white">💾 전체 시스템 메모리 (OS RAM)</div>
        <div class="card-body d-flex flex-column justify-content-center">
          <h5 class="card-title mb-1">
            사용 중: <span class="fw-bold text-info" th:text="${metrics.usedMemory}">0</span> /
            <span th:text="${metrics.totalMemory}">0</span> GB
          </h5>
          <p class="card-text text-muted small mb-2">전체 메모리 사용률: <span th:text="${metrics.memoryPercent}">0</span>%</p>
          <div class="progress" style="height: 20px;">
            <div class="progress-bar bg-info progress-bar-striped progress-bar-animated"
                 role="progressbar" th:style="'width: ' + ${metrics.memoryPercent} + '%'"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-2">
    <div class="col-12">
      <div class="card border-danger">
        <div class="card-header bg-danger text-white">🎮 NVIDIA GPU 모니터링 (3D & Memory)</div>
        <div class="card-body">
          <div class="row g-4 text-center">
            <div class="col-12 col-md-4 border-end-md">
              <h5 class="text-muted fw-semibold">GPU 3D 사용률</h5>
              <h2 class="text-danger my-3 fw-bold"><span th:text="${metrics.gpu3d}">0</span>%</h2>
              <div class="progress mx-auto" style="height: 12px; max-width: 80%;">
                <div class="progress-bar bg-danger" role="progressbar" th:style="'width: ' + ${metrics.gpu3d} + '%'"></div>
              </div>
            </div>

            <div class="col-12 col-md-4 border-end-md">
              <h5 class="text-muted fw-semibold">전용 GPU 메모리</h5>
              <h2 class="text-warning my-3 fw-bold"><span th:text="${metrics.gpuDedicatedUsed}">0</span> MB</h2>
              <p class="text-muted small m-0">Total VRAM: <span th:text="${metrics.gpuDedicatedTotal}">0</span> MB</p>
            </div>

            <div class="col-12 col-md-4">
              <h5 class="text-muted fw-semibold">공용 GPU 메모리</h5>
              <h2 class="text-success my-3 fw-bold"><span th:text="${metrics.gpuSharedUsed}">0</span> MB</h2>
              <p class="text-muted small m-0 text-decoration-underline">(System RAM Shared)</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  @media (min-width: 768px) {
    .border-end-md {
      border-end: 1px solid #dee2e6 !important; /* 가로 분할선 제거 */
      border-right: 1px solid #dee2e6 !important; /* 세로 분할선 추가 */
    }
  }
</style>

<script>
  let timeLeft = 5;
  const timerElement = document.getElementById('refresh-timer');
  setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      location.reload();
    } else {
      timerElement.innerText = timeLeft + "초 후 갱신";
    }
  }, 1000);
</script>
</body>
</html>
