<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Multimodal Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --sidebar-bg: #171717; --chat-bg: #212121; --input-bg: #2f2f2f; --text-light: #eceecf; }
        body { background-color: var(--chat-bg); color: #fff; min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #333; }
        .main-chat-area { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        .chat-container { flex-grow: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 24px; }
        .message-row { display: flex; width: 100%; gap: 16px; margin-bottom: 8px; }
        .user-row { justify-content: flex-end; }
        .chat-bubble { max-width: 80%; padding: 14px 20px; border-radius: 18px; font-size: 1rem; line-height: 1.6; word-break: break-all; }
        .user-bubble { background-color: #303030; color: #f5f5f5; border-bottom-right-radius: 4px; }
        .ai-bubble { background-color: transparent; color: #e3e3e3; border-bottom-left-radius: 4px; }
        .input-wrapper-zone { padding: 10px 15% 30px 15%; background: linear-gradient(transparent, var(--chat-bg) 30%); }
        .modern-input-box { background-color: var(--input-bg); border: 1px solid #424242; border-radius: 26px; padding: 8px 16px; display: flex; flex-direction: column; }
        .inner-textarea { background: transparent; border: none; color: #fff; resize: none; max-height: 200px; outline: none; padding: 8px 4px; }
        .control-panel-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .preview-thumbnails-pane { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .thumb-img-frame { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid #555; position: relative; }
        .btn-icon-action { background: none; border: none; color: #b4b4b4; font-size: 1.25rem; cursor: pointer; transition: color 0.15s; }
        .btn-icon-action:hover { color: #fff; }
        .feedback-buttons { margin-top: 8px; display: flex; gap: 12px; }
        .feedback-btn { background: none; border: none; color: #888; font-size: 0.85rem; cursor: pointer; }
        .feedback-btn:hover { color: #fff; }
        .active-like { color: #4285f4 !important; }
        .active-dislike { color: #ea4335 !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="sidebar p-3 text-secondary">
    <div>
        <div class="text-white fw-bold fs-5 mb-4 px-2">🧗‍♂️ Climbing RAG Hub</div>
        <nav class="nav flex-column gap-2">
            <a class="nav-link text-white bg-dark rounded px-3 py-2" href="/"><i class="bi bi-cpu-fill me-2"></i>멀티모달 추천 센터</a>
            <a class="nav-link text-muted px-3 py-2" href="/chatbot"><i class="bi bi-chat-square-text me-2"></i>일반 지식 RAG</a>
            <!--<a class="nav-link text-muted px-3 py-2" href="/admin/embedding"><i class="bi bi-database-fill-gear me-2"></i>데이터 인제스션</a>-->
        </nav>
    </div>
    <div class="small px-2 border-top border-dark pt-3">v2.0 Refactored</div>
</div>

<div class="main-chat-area">
    <div class="chat-container" id="multimodalChatBox">
        <div class="message-row">
            <div class="ai-bubble">
                <h4>안녕하세요! 대화형 암벽화 매칭 센터입니다.</h4>
                발의 특징이 잘 드러난 <strong>여러 장의 사진</strong>을 한번에 올리시거나 자유롭게 질문을 텍스트로 추가해 주시면 정밀 분석이 시작됩니다.
            </div>
        </div>
    </div>

    <div class="input-wrapper-zone">
        <div class="modern-input-box">
            <div id="previewThumbnails" class="preview-thumbnails-pane"></div>

            <textarea id="compositeInput" class="inner-textarea" rows="1" placeholder="메시지를 입력하거나 다중 발 이미지를 첨부해 주세요..."></textarea>

            <div class="control-panel-bar">
                <div>
                    <input type="file" id="multiImageFiles" class="d-none" accept="image/*" multiple>
                    <button class="btn-icon-action" onclick="document.getElementById('multiImageFiles').click()" title="이미지 다중 첨부">
                        <i class="bi bi-paperclip"></i>
                    </button>
                </div>
                <button id="submitBtn" class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width:36px; height:36px;">
                    <i class="bi bi-arrow-up-short text-dark fs-4"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
