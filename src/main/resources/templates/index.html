<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM RAG System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .chat-box { height: 400px; overflow-y: auto; background: white; border: 1px solid #dee2e6; padding: 15px; border-radius: 5px; }
        .user-msg { background: #e3f2fd; padding: 8px 12px; border-radius: 15px; display: inline-block; max-width: 80%; float: right; clear: both; margin-bottom: 10px; }
        .ai-msg { background: #f1f3f5; padding: 12px 15px; border-radius: 15px; display: inline-block; max-width: 80%; float: left; clear: both; margin-bottom: 10px; }

        /* 🌟 [개선] 채팅창 높이를 모바일 환경에 맞춰 유연하게 조정 (최대 500px, 최소 350px) */
        .chat-box {
            height: 50vh;
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
            background: white;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
        }

        /* 🌟 [개선] 모바일 등 좁은 화면에서는 말풍선이 너무 작아지지 않도록 max-width를 90%로 확대 */
        .user-msg {
            background: #e3f2fd;
            padding: 8px 12px;
            border-radius: 15px;
            display: inline-block;
            max-width: 90%;
            float: right;
            clear: both;
            margin-bottom: 10px;
            word-break: break-all; /* 긴 영문/링크 깨짐 방지 */
        }

        .ai-msg {
            background: #f1f3f5;
            padding: 12px 15px;
            border-radius: 15px;
            display: inline-block;
            max-width: 90%;
            float: left;
            clear: both;
            margin-bottom: 10px;
            word-break: break-all;
        }

        /* 마크다운 렌더링 내부 요소 여백 미세 조정 */
        .ai-msg p:last-child { margin-bottom: 0; }
        .ai-msg ul, .ai-msg ol { padding-left: 20px; }

        /* 테이블이 AI 응답에 들어올 경우 가로 스크롤 보장 */
        .ai-msg table { width: 100%; overflow-x: auto; display: block; }
    </style>
</head>
<body>

<div class="container px-3 py-4 mt-md-4">
    <h2 class="text-center mb-4 fs-3 fw-bold">🤖 Local RAG System<br class="d-block d-sm-none"> <span class="fs-5 text-muted">(Ollama + Elasticsearch)</span></h2>
<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">🧗‍♂️ AI 기반 암벽화 맞춤 추천 시스템</h2>

    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="recommend-tab" data-bs-toggle="tab" data-bs-target="#recommend" type="button" role="tab">1. 발 이미지로 암벽화 추천</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="shoe-tab" data-bs-toggle="tab" data-bs-target="#shoe" type="button" role="tab">2. 암벽화 데이터 임베딩 (Admin)</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic" type="button" role="tab">3. 일반 RAG 챗봇</button>
        </li>
    </ul>

    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="card p-3 shadow-sm mb-3">
                <h5 class="fw-bold fs-6">1-A. 텍스트 지식 주입</h5>
                <textarea id="documentInput" class="form-control mb-3" rows="4" placeholder="예: 홍길동의 직업은 의적이며, 활빈당의 당수이다."></textarea>
                <button onclick="ingestDocument()" class="btn btn-primary w-100">텍스트 저장</button>
                <div id="ingestStatus" class="mt-2 small text-success fw-bold"></div>
            </div>
            <div class="card p-3 shadow-sm">
                <h5 class="fw-bold fs-6">1-B. 파일 지식 주입 (PDF, TXT 등)</h5>
                <input type="file" id="fileInput" class="form-control mb-3" accept=".txt,.pdf,.docx,.xlsx,.hwp"/>
                <button onclick="uploadFile()" class="btn btn-success w-100">파일 업로드 및 저장</button>
                <div id="fileStatus" class="mt-2 small text-success fw-bold"></div>
    <div class="tab-content" id="myTabContent">

        <div class="tab-pane fade show active" id="recommend" role="tabpanel">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card p-3 shadow-sm">
                        <h5>📸 내 발 이미지 업로드</h5>
                        <p class="text-muted small">발의 윤곽이 잘 보이는 이미지를 올려주세요.</p>
                        <input type="file" id="footImageInput" class="form-control mb-3" accept="image/*" onchange="previewImage(event)"/>
                        <img id="imagePreview" class="preview-img border rounded" />
                        <button onclick="recommendShoe()" class="btn btn-primary w-100">이미지 분석 및 추천 받기</button>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card p-3 shadow-sm">
                        <h5>🤖 추천 결과</h5>
                        <div id="recommendChatBox" class="chat-box mb-3">
                            <div class="ai-msg">이미지를 업로드하면 Vision 모델이 발을 분석하여 알맞은 암벽화를 추천합니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card p-3 shadow-sm h-100 d-flex flex-column justify-content-between">
                <h5 class="fw-bold fs-6">3. 임베딩 지식 기반 Q&A</h5>
                <div id="chatBox" class="chat-box mb-3">
                    <div class="ai-msg">안녕하세요! 주입된 지식을 바탕으로 답변해 드립니다. 질문을 입력해주세요.</div>
                </div>

                <div class="input-group">
                    <input type="text" id="queryInput" class="form-control" placeholder="질문을 입력하세요..." onkeypress="if(event.keyCode==13) sendQuery()">
                    <button onclick="sendQuery()" class="btn btn-dark px-3 px-sm-4">질문</button>
        <div class="tab-pane fade" id="shoe" role="tabpanel">
            <div class="card p-4 shadow-sm w-75 mx-auto">
                <h5 class="mb-3">👟 암벽화 스펙 데이터 주입</h5>
                <input type="text" id="brandInput" class="form-control mb-2" placeholder="암벽화 브랜드 (예: 라 스포르티바)" />
                <input type="text" id="shoeNameInput" class="form-control mb-2" placeholder="암벽화 모델명 (예: 솔루션)" />
                <input type="text" id="lastInput" class="form-control mb-2" placeholder="족형 (예: 다운토/턴인(비대칭))" />
                <input type="text" id="stiffnessInput" class="form-control mb-2" placeholder="강성 타입 (예: 중간, 중약, 강함)" />
                <input type="text" id="hillCupSizeInput" class="form-control mb-2" placeholder="힐컵 크기 (예: 중간, 큼)" />
                <input type="text" id="mainUsesInput" class="form-control mb-2" placeholder="주요 용토 (예: 볼더링, 리드, 올라운드)" />
                <textarea id="shoeDescInput" class="form-control mb-3" rows="5" placeholder="특징 입력 (예: 다운토가 심하며 볼더링에 적합. 발볼이 좁고 발등이 높은 사람에게 추천.)"></textarea>
                <button onclick="ingestShoe()" class="btn btn-success w-100">벡터 DB에 저장</button>
                <div id="shoeStatus" class="mt-2 small text-success fw-bold text-center"></div>
            </div>
        </div>

        <div class="tab-pane fade" id="basic" role="tabpanel">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card p-3 shadow-sm mb-3">
                        <h5>문서 지식 주입</h5>
                        <textarea id="documentInput" class="form-control mb-3" rows="4"></textarea>
                        <button onclick="ingestDocument()" class="btn btn-secondary w-100">텍스트 저장</button>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card p-3 shadow-sm">
                        <h5>일반 Q&A</h5>
                        <div id="chatBox" class="chat-box mb-3"></div>
                        <div class="input-group">
                            <input type="text" id="queryInput" class="form-control" placeholder="질문..." onkeypress="if(event.keyCode==13) sendQuery()">
                            <button onclick="sendQuery()" class="btn btn-dark">질문하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // --- 이미지 프리뷰 로직 ---
    function previewImage(event) {
        const reader = new FileReader();
        const imageField = document.getElementById("imagePreview");
        reader.onload = function() {
            if (reader.readyState === 2) {
                imageField.src = reader.result;
                imageField.style.display = 'block';
            }
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    // --- 1. 발 이미지 업로드 및 추천 ---
    async function recommendShoe() {
        const fileInput = document.getElementById('footImageInput');
        if (fileInput.files.length === 0) { alert("이미지를 선택하세요."); return; }
    // 파일 인제스션 요청 처리
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');

        const chatBox = document.getElementById('recommendChatBox');
        chatBox.innerHTML += `<div class="user-msg">사진을 보냈습니다. 제 발에 맞는 암벽화를 추천해주세요.</div>`;

        const aiDiv = document.createElement('div');
        aiDiv.className = 'ai-msg';
        aiDiv.innerText = 'Vision 모델이 발 이미지를 분석하고 있습니다. 잠시만 기다려주세요... (약 10~30초 소요)';
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch('/api/rag/recommend-shoe', {
                method: 'POST',
                body: formData
            });
            const result = await response.text();
            fileStatus.innerText = result;
            fileInput.value = '';
        } catch (error) {
            fileStatus.innerText = "파일 저장 실패: " + error;
        }
    }

    // 3. RAG 질문 및 SSE 스트리밍 수신
    function sendQuery() {
        const queryInput = document.getElementById('queryInput');
        const query = queryInput.value;
        if (!query.trim()) return;

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let isFirst = true;
            let rawMarkdownBuffer = "";
        const chatBox = document.getElementById('chatBox');

        // 사용자 메시지 화면 추가
        const userDiv = document.createElement('div');
        userDiv.className = 'user-msg';
        userDiv.innerText = query;
        chatBox.appendChild(userDiv);
        queryInput.value = '';

        // AI 응답 공간 미리 생성
        const aiDiv = document.createElement('div');
        aiDiv.className = 'ai-msg';
        aiDiv.innerText = '생각 중...';
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        // Server-Sent Events 연결
        const eventSource = new EventSource(`/api/rag/chat?query=${encodeURIComponent(query)}`);

        let isFirst = true;
        let rawMarkdownBuffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                let chunkText = decoder.decode(value, { stream: true });

                // Spring Data SSE 형식인 'data:' 접두사 제거
                const lines = chunkText.split('\n');
                for (let line of lines) {
                    if (line.startsWith('data:')) {
                        let data = line.replace('data:', '');
                        data = data.replaceAll('[SPACE]', ' ');

                        if (isFirst) { aiDiv.innerText = ''; isFirst = false; }
                        rawMarkdownBuffer += data;
                        aiDiv.innerHTML = marked.parse(rawMarkdownBuffer);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            }
        } catch (error) {
            aiDiv.innerText = "분석 중 오류가 발생했습니다: " + error;
        }
    }
            let data = event.data;
            data = data.replaceAll('[SPACE]', ' ');
            rawMarkdownBuffer += data;
            aiDiv.innerHTML = marked.parse(rawMarkdownBuffer);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

    // --- 2. 암벽화 스펙 데이터 인제스션 ---
    async function ingestShoe() {
        const brand = document.getElementById('brandInput').value;
        const shoeName = document.getElementById('shoeNameInput').value;
        const last = document.getElementById('lastInput').value;
        const stiffness = document.getElementById('stiffnessInput').value;
        const hillCupSize = document.getElementById('hillCupSizeInput').value;
        const mainUses = document.getElementById('mainUsesInput').value;
        const desc = document.getElementById('shoeDescInput').value;
        const statusDiv = document.getElementById('shoeStatus');

        if(!shoeName.trim() || !desc.trim()) { alert('모든 정보를 입력하세요.'); return; }

        statusDiv.innerText = "저장 중...";
        try {
            const response = await fetch('/api/rag/ingest-shoe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ brand: brand, shoeName: shoeName, last: last, stiffness: stiffness, hillCupSize: hillCupSize, mainUses: mainUses, description: desc })
            });
            const result = await response.text();
            statusDiv.innerText = result;
            document.getElementById('brandInput').value = '';
            document.getElementById('shoeNameInput').value = '';
            document.getElementById('lastInput').value = '';
            document.getElementById('stiffnessInput').value = '';
            document.getElementById('hillCupSizeInput').value = '';
            document.getElementById('mainUsesInput').value = '';
            document.getElementById('shoeDescInput').value = '';
        } catch (error) {
            statusDiv.innerText = "저장 실패: " + error;
        }
    }

    // (기존 텍스트 주입 및 일반 Chat 코드는 유지 - 생략 가능)
    // 기존 스크립트의 ingestDocument, sendQuery 함수들을 복사해서 넣어주세요.
</script>
</body>
</html>
