<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Local LLM RAG & Foot Climbing Shoes Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        .chat-box { height: 500px; overflow-y: auto; background: white; border: 1px solid #dee2e6; padding: 15px; border-radius: 5px; }
        .user-msg { background: #e3f2fd; padding: 8px 12px; border-radius: 15px; display: inline-block; max-width: 80%; float: right; clear: both; margin-bottom: 10px; }
        .ai-msg { background: #f1f3f5; padding: 12px 15px; border-radius: 15px; display: inline-block; max-width: 90%; float: left; clear: both; margin-bottom: 10px; position: relative; width: 100%; }
        .ai-msg p:last-child { margin-bottom: 0; }
        .ai-msg ul, .ai-msg ol { padding-left: 20px; }
        /* 테이블 마크다운 가시성을 위한 CSS 스타일링 추가 */
        .ai-msg table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; }
        .ai-msg th, .ai-msg td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        .ai-msg th { background-color: #e9ecef; }
        .pdf-btn-container { text-align: right; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">🧗‍♂️ 발 이미지 분석 기반 암벽화 맞춤 추천 시스템</h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm mb-3">
                <h5>1-A. 텍스트 지식 주입 (암벽화 가이드)</h5>
                <textarea id="documentInput" class="form-control mb-3" rows="3" placeholder="예: 스카르파 인스티нкт 모델은 발볼이 넓은 로만형 발에 최적화되어 설계되었다."></textarea>
                <button onclick="ingestDocument()" class="btn btn-primary w-100">텍스트 저장</button>
                <div id="ingestStatus" class="mt-2 small text-success fw-bold"></div>
            </div>

            <div class="card p-3 shadow-sm mb-3">
                <h5>1-B. 가이드 파일 주입 (PDF, TXT)</h5>
                <input type="file" id="fileInput" class="form-control mb-3" accept=".txt,.pdf,.docx"/>
                <button onclick="uploadFile()" class="btn btn-success w-100">파일 업로드 및 저장</button>
                <div id="fileStatus" class="mt-2 small text-success fw-bold"></div>
            </div>

            <div class="card p-3 shadow-sm border-primary">
                <h5 class="text-primary">1-C. 🦶 발 이미지 진단 및 추천</h5>
                <p class="text-muted small">선명한 발바닥 또는 발등 사진을 첨부하면 AI 족형 진단 후 맞춤 암벽화를 바인딩 추천합니다.</p>
                <input type="file" id="footImageInput" class="form-control mb-3" accept="image/*"/>
                <button onclick="analyzeFootImage()" class="btn btn-primary w-100">발 분석 및 슈즈 추천 시작</button>
                <div id="footStatus" class="mt-2 small text-primary fw-bold"></div>
            </div>
        </div>

        <div class="col-md-8">
            <div id="pdfActionContainer" class="pdf-btn-container">
                <button onclick="downloadReportPDF()" class="btn btn-danger btn-sm">📄 추천 리포트 PDF 다운로드</button>
            </div>

            <div class="card p-3 shadow-sm">
                <h5>3. 추천 진단 결과 및 대화 창</h5>
                <div id="chatBox" class="chat-box mb-3">
                    <div class="ai-msg" id="initMessage">안녕하세요! 지식을 주입하시거나 <b>발 이미지 사진</b>을 올려주시면 맞춤형 암벽화를 정밀 추천해 드립니다.</div>
                </div>
                <div class="input-group">
                    <input type="text" id="queryInput" class="form-control" placeholder="질문을 입력하세요..." onkeypress="if(event.keyCode==13) sendQuery()">
                    <button onclick="sendQuery()" class="btn btn-dark">질문하기</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 기존 텍스트 및 일반 파일 주입 함수는 완벽히 유지됩니다.
    async function ingestDocument() {
        const content = document.getElementById('documentInput').value;
        const statusDiv = document.getElementById('ingestStatus');
        if(!content.trim()) { alert('내용을 입력하세요.'); return; }
        statusDiv.innerText = "임베딩 및 저장 중...";
        try {
            const response = await fetch('/api/rag/ingest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });
            const result = await response.text();
            statusDiv.innerText = result;
            document.getElementById('documentInput').value = '';
        } catch (error) { statusDiv.innerText = "저장 실패: " + error; }
    }

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        if (fileInput.files.length === 0) { alert("업로드할 파일을 선택해 주세요."); return; }
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        fileStatus.innerText = "문서 분석 및 벡터화 진행 중...";
        try {
            const response = await fetch('/api/rag/ingest-file', { method: 'POST', body: formData });
            const result = await response.text();
            fileStatus.innerText = result;
            fileInput.value = '';
        } catch (error) { fileStatus.innerText = "파일 저장 실패: " + error; }
    }

    // 3. 기존 일반 텍스트 RAG 질의 시스템
    Lich function sendQuery() {
        const queryInput = document.getElementById('queryInput');
        const query = queryInput.value;
        if (!query.trim()) return;

        const chatBox = document.getElementById('chatBox');
        const userDiv = document.createElement('div');
        userDiv.className = 'user-msg';
        userDiv.innerText = query;
        chatBox.appendChild(userDiv);
        queryInput.value = '';

        const aiDiv = document.createElement('div');
        aiDiv.className = 'ai-msg';
        aiDiv.innerText = '정보 탐색 및 분석 중...';
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        const eventSource = new EventSource(`/api/rag/chat?query=${encodeURIComponent(query)}`);
        handleStreamResponse(eventSource, aiDiv);
    }

    /**
     * [추가] 핵심 기능: 발 이미지 업로드 및 멀티모달 분석 스트림 호출 함수
     */
    async function analyzeFootImage() {
        const imageInput = document.getElementById('footImageInput');
        const footStatus = document.getElementById('footStatus');
        const chatBox = document.getElementById('chatBox');

        if (imageInput.files.length === 0) {
            alert("분석할 발 사진 이미지를 업로드해 주세요.");
            return;
        }

        const file = imageInput.files[0];
        const formData = new FormData();
        formData.append("file", file);

        footStatus.innerText = "족형 시각 데이터 분석 및 RAG 결합 진행 중...";
        document.getElementById('pdfActionContainer').style.display = 'none';

        // 사용자단 화면 스크린 처리
        const userDiv = document.createElement('div');
        userDiv.className = 'user-msg';
        userDiv.innerText = `📷 발 이미지 분석 요청함: (${file.name})`;
        chatBox.appendChild(userDiv);

        // 결과 출력을 위한 AI 응답 노드 프리빌드
        const aiDiv = document.createElement('div');
        aiDiv.className = 'ai-msg target-report'; // PDF 출력을 추적하기 위한 마킹 클래스 부여
        aiDiv.id = "latestReportOutput";
        aiDiv.innerText = "비전 AI 모델이 발 모양을 정밀 분석 중입니다. 잠시만 기다려 주세요...";
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Multipart 요청 송신 및 ReadableStream 수신 파싱 처리 (SSE 커스텀 구현)
            const response = await fetch('/api/rag/analyze-foot', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error("서버 리스폰스 에러 발생");

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let rawMarkdownBuffer = "";
            let isFirstChunk = true;

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                let chunkStr = decoder.decode(value, { stream: true });
                // SSE 포맷 제거 처리 ('data:' 프리픽스 파싱)
                const lines = chunkStr.split("\n");
                for (let line of lines) {
                    if (line.startsWith("data:")) {
                        let data = line.replace("data:", "").trim();
                        data = data.replaceAll('[SPACE]', ' ');

                        if (isFirstChunk) {
                            aiDiv.innerText = "";
                            isFirstChunk = false;
                        }
                        rawMarkdownBuffer += data;
                        aiDiv.innerHTML = marked.parse(rawMarkdownBuffer);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            }

            footStatus.innerText = "분석 완료! 맞춤 리포트가 하단에 출력되었습니다.";
            // 분석 완수 시 상단 PDF 저장 버튼 액티베이션
            document.getElementById('pdfActionContainer').style.display = 'block';
            imageInput.value = '';

        } catch (error) {
            footStatus.innerText = "이미지 분석 오류 발생";
            aiDiv.innerText = "에러 사유: " + error.message;
        }
    }

    // 공통 SSE 스트림 버퍼 가동 제어기
    function handleStreamResponse(eventSource, aiDiv) {
        let isFirst = true;
        let rawMarkdownBuffer = "";
        eventSource.onmessage = function (event) {
            if (isFirst) { aiDiv.innerText = ''; isFirst = false; }
            let data = event.data.replaceAll('[SPACE]', ' ');
            rawMarkdownBuffer += data;
            aiDiv.innerHTML = marked.parse(rawMarkdownBuffer);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        };
        eventSource.onerror = function () { eventSource.close(); };
    }

    /**
     * [추가] 완성된 마크다운 암벽화 추천 리포트 영역을 깨끗한 PDF 파일로 다운로드시키는 클라이언트 함수
     */
    function downloadReportPDF() {
        const element = document.getElementById('latestReportOutput');
        if (!element) {
            alert("다운로드할 리포트 내용이 존재하지 않습니다.");
            return;
        }

        // 깔끔한 문서 출력을 위한 디자인 옵션 객체 정의
        const options = {
            margin:       [10, 15, 10, 15], // 상 우 하 좌 마진 설정
            filename:     'Climbing_Shoes_Recommendation_Report.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // PDF 빌드 및 실행 프로세스 트리거
        html2pdf().set(options).from(element).save();
    }
</script>
</body>
</html>
