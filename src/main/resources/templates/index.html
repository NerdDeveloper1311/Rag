<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM RAG System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { background-color: #f8f9fa; }

        /* 🌟 [개선] 채팅창 높이를 모바일 환경에 맞춰 유연하게 조정 (최대 500px, 최소 350px) */
        .chat-box {
            height: 50vh;
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
            background: white;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
        }

        /* 🌟 [개선] 모바일 등 좁은 화면에서는 말풍선이 너무 작아지지 않도록 max-width를 90%로 확대 */
        .user-msg {
            background: #e3f2fd;
            padding: 8px 12px;
            border-radius: 15px;
            display: inline-block;
            max-width: 90%;
            float: right;
            clear: both;
            margin-bottom: 10px;
            word-break: break-all; /* 긴 영문/링크 깨짐 방지 */
        }

        .ai-msg {
            background: #f1f3f5;
            padding: 12px 15px;
            border-radius: 15px;
            display: inline-block;
            max-width: 90%;
            float: left;
            clear: both;
            margin-bottom: 10px;
            word-break: break-all;
        }

        /* 마크다운 렌더링 내부 요소 여백 미세 조정 */
        .ai-msg p:last-child { margin-bottom: 0; }
        .ai-msg ul, .ai-msg ol { padding-left: 20px; }

        /* 테이블이 AI 응답에 들어올 경우 가로 스크롤 보장 */
        .ai-msg table { width: 100%; overflow-x: auto; display: block; }
    </style>
</head>
<body>

<div class="container px-3 py-4 mt-md-4">
    <h2 class="text-center mb-4 fs-3 fw-bold">🤖 Local RAG System<br class="d-block d-sm-none"> <span class="fs-5 text-muted">(Ollama + Elasticsearch)</span></h2>

    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="card p-3 shadow-sm mb-3">
                <h5 class="fw-bold fs-6">1-A. 텍스트 지식 주입</h5>
                <textarea id="documentInput" class="form-control mb-3" rows="4" placeholder="예: 홍길동의 직업은 의적이며, 활빈당의 당수이다."></textarea>
                <button onclick="ingestDocument()" class="btn btn-primary w-100">텍스트 저장</button>
                <div id="ingestStatus" class="mt-2 small text-success fw-bold"></div>
            </div>
            <div class="card p-3 shadow-sm">
                <h5 class="fw-bold fs-6">1-B. 파일 지식 주입 (PDF, TXT 등)</h5>
                <input type="file" id="fileInput" class="form-control mb-3" accept=".txt,.pdf,.docx,.xlsx,.hwp"/>
                <button onclick="uploadFile()" class="btn btn-success w-100">파일 업로드 및 저장</button>
                <div id="fileStatus" class="mt-2 small text-success fw-bold"></div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card p-3 shadow-sm h-100 d-flex flex-column justify-content-between">
                <h5 class="fw-bold fs-6">3. 임베딩 지식 기반 Q&A</h5>
                <div id="chatBox" class="chat-box mb-3">
                    <div class="ai-msg">안녕하세요! 주입된 지식을 바탕으로 답변해 드립니다. 질문을 입력해주세요.</div>
                </div>

                <div class="input-group">
                    <input type="text" id="queryInput" class="form-control" placeholder="질문을 입력하세요..." onkeypress="if(event.keyCode==13) sendQuery()">
                    <button onclick="sendQuery()" class="btn btn-dark px-3 px-sm-4">질문</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. 기존 텍스트 주입 요청
    async function ingestDocument() {
        const content = document.getElementById('documentInput').value;
        const statusDiv = document.getElementById('ingestStatus');
        if(!content.trim()) { alert('내용을 입력하세요.'); return; }
        statusDiv.innerText = "임베딩 및 저장 중...";
        try {
            const response = await fetch('/api/rag/ingest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });
            const result = await response.text();
            statusDiv.innerText = result;
            document.getElementById('documentInput').value = '';
        } catch (error) {
            statusDiv.innerText = "저장 실패: " + error;
        }
    }

    // 파일 인제스션 요청 처리
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');

        if (fileInput.files.length === 0) {
            alert("업로드할 파일을 선택해 주세요.");
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        fileStatus.innerText = "문서 분석 및 벡터화 진행 중...";

        try {
            const response = await fetch('/api/rag/ingest-file', {
                method: 'POST',
                body: formData
            });
            const result = await response.text();
            fileStatus.innerText = result;
            fileInput.value = '';
        } catch (error) {
            fileStatus.innerText = "파일 저장 실패: " + error;
        }
    }

    // 3. RAG 질문 및 SSE 스트리밍 수신
    function sendQuery() {
        const queryInput = document.getElementById('queryInput');
        const query = queryInput.value;
        if (!query.trim()) return;

        const chatBox = document.getElementById('chatBox');

        // 사용자 메시지 화면 추가
        const userDiv = document.createElement('div');
        userDiv.className = 'user-msg';
        userDiv.innerText = query;
        chatBox.appendChild(userDiv);
        queryInput.value = '';

        // AI 응답 공간 미리 생성
        const aiDiv = document.createElement('div');
        aiDiv.className = 'ai-msg';
        aiDiv.innerText = '생각 중...';
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        // Server-Sent Events 연결
        const eventSource = new EventSource(`/api/rag/chat?query=${encodeURIComponent(query)}`);

        let isFirst = true;
        let rawMarkdownBuffer = "";

        eventSource.onmessage = function (event) {
            if (isFirst) {
                aiDiv.innerText = '';
                isFirst = false;
            }

            let data = event.data;
            data = data.replaceAll('[SPACE]', ' ');
            rawMarkdownBuffer += data;
            aiDiv.innerHTML = marked.parse(rawMarkdownBuffer);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        eventSource.onerror = function (err) {
            eventSource.close();
        };
    }
</script>
</body>
</html>
