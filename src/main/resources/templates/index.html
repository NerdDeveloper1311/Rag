<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Local LLM RAG System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .chat-box { height: 400px; overflow-y: auto; background: white; border: 1px solid #dee2e6; padding: 15px; border-radius: 5px; }
        .user-msg { background: #e3f2fd; padding: 8px 12px; border-radius: 15px; display: inline-block; max-width: 80%; float: right; clear: both; margin-bottom: 10px; }
        .ai-msg { background: #f1f3f5; padding: 8px 12px; border-radius: 15px; display: inline-block; max-width: 80%; float: left; clear: both; margin-bottom: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">🤖 Local RAG System (Ollama + Elasticsearch)</h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm mb-3">
                <h5>1-A. 텍스트 지식 주입</h5>
                <textarea id="documentInput" class="form-control mb-3" rows="4" placeholder="예: 홍길동의 직업은 의적이며, 활빈당의 당수이다."></textarea>
                <button onclick="ingestDocument()" class="btn btn-primary w-100">텍스트 저장</button>
                <div id="ingestStatus" class="mt-2 small text-success fw-bold"></div>
            </div>

            <div class="card p-3 shadow-sm">
                <h5>1-B. 파일 지식 주입 (PDF, TXT 등)</h5>
                <p class="text-muted small">AI에게 학습시킬 문서를 파일 단위로 등록하세요.</p>
                <input type="file" id="fileInput" class="form-control mb-3" accept=".txt,.pdf,.docx,.xlsx,.hwp"/>
                <button onclick="uploadFile()" class="btn btn-success w-100">파일 업로드 및 저장</button>
                <div id="fileStatus" class="mt-2 small text-success fw-bold"></div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-3 shadow-sm">
                <h5>3. 임베딩 지식 기반 Q&A</h5>
                <div id="chatBox" class="chat-box mb-3">
                    <div class="ai-msg">안녕하세요! 주입된 지식을 바탕으로 답변해 드립니다. 질문을 입력해주세요.</div>
                </div>
                <div class="input-group">
                    <input type="text" id="queryInput" class="form-control" placeholder="질문을 입력하세요..." onkeypress="if(event.keyCode==13) sendQuery()">
                    <button onclick="sendQuery()" class="btn btn-dark">질문하기</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. 기존 텍스트 주입 요청
    async function ingestDocument() {
        const content = document.getElementById('documentInput').value;
        const statusDiv = document.getElementById('ingestStatus');
        if(!content.trim()) { alert('내용을 입력하세요.'); return; }
        statusDiv.innerText = "임베딩 및 저장 중...";
        try {
            const response = await fetch('/api/rag/ingest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });
            const result = await response.text();
            statusDiv.innerText = result;
            document.getElementById('documentInput').value = '';
        } catch (error) {
            statusDiv.innerText = "저장 실패: " + error;
        }
    }

    // [추가] 파일 인제스션 요청 처리
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');

        if (fileInput.files.length === 0) {
            alert("업로드할 파일을 선택해 주세요.");
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        fileStatus.innerText = "문서 분석 및 벡터화 진행 중...";

        try {
            const response = await fetch('/api/rag/ingest-file', {
                method: 'POST',
                body: formData // Multipart 요청 시 Headers는 브라우저가 자동 설정하도록 비워둡니다.
            });
            const result = await response.text();
            fileStatus.innerText = result;
            fileInput.value = ''; // 파일 선택 초기화
        } catch (error) {
            fileStatus.innerText = "파일 저장 실패: " + error;
        }
    }

    // 3. RAG 질문 및 SSE 스트리밍 수신
    function sendQuery() {
        const queryInput = document.getElementById('queryInput');
        const query = queryInput.value;
        if (!query.trim()) return;

        const chatBox = document.getElementById('chatBox');

        const userDiv = document.createElement('div');
        userDiv.className = 'user-msg';
        userDiv.innerText = query;
        chatBox.appendChild(userDiv);
        queryInput.value = '';

        const aiDiv = document.createElement('div');
        aiDiv.className = 'ai-msg';
        aiDiv.innerText = '생각 중...';
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        const eventSource = new EventSource(`/api/rag/chat?query=${encodeURIComponent(query)}`);
        let isFirst = true;

        eventSource.onmessage = function(event) {
            if (isFirst) {
                aiDiv.innerText = '';
                isFirst = false;
            }
            let data = event.data;
            data = data.replaceAll( '[SPACE]', ' ' );
            aiDiv.innerText += data;
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        eventSource.onerror = function(err) {
            eventSource.close();
        };
    }
</script>
</body>
</html>
