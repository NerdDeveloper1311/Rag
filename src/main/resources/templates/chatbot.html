<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Knowledge RAG Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --sidebar-bg: #171717; --chat-bg: #212121; --input-bg: #2f2f2f; }
    body { background-color: var(--chat-bg); color: #fff; min-height: 100vh; display: flex; }
    .sidebar { width: 260px; background-color: var(--sidebar-bg); flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #333; }
    .main-chat-area { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
    .chat-container { flex-grow: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 24px; }
    .message-row { display: flex; width: 100%; gap: 16px; margin-bottom: 8px; }
    .user-row { justify-content: flex-end; }
    .chat-bubble { max-width: 80%; padding: 14px 20px; border-radius: 18px; font-size: 1rem; line-height: 1.6; word-break: break-all; }
    .user-bubble { background-color: #303030; color: #f5f5f5; border-bottom-right-radius: 4px; }
    .ai-bubble { background-color: transparent; color: #e3e3e3; border-bottom-left-radius: 4px; }
    .input-wrapper-zone { padding: 10px 15% 30px 15%; background: linear-gradient(transparent, var(--chat-bg) 30%); }
    .modern-input-box { background-color: var(--input-bg); border: 1px solid #424242; border-radius: 26px; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
    .inner-textarea { background: transparent; border: none; color: #fff; resize: none; max-height: 200px; outline: none; flex-grow: 1; padding: 4px 0; }
    .context-badge { background-color: #1e3a8a; color: #93c5fd; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; border: 1px solid #2563eb; display: inline-flex; align-items: center; gap: 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="sidebar p-3 text-secondary">
  <div>
    <div class="text-white fw-bold fs-5 mb-4 px-2">🧗‍♂️ Climbing RAG Hub</div>
    <nav class="nav flex-column gap-2">
      <a class="nav-link text-muted px-3 py-2" href="/"><i class="bi bi-cpu-fill me-2"></i>멀티모달 추천 센터</a>
      <a class="nav-link text-white bg-dark rounded px-3 py-2" href="/chatbot"><i class="bi bi-chat-square-text me-2"></i>일반 지식 RAG</a>
      <a class="nav-link text-muted px-3 py-2" href="/admin/embedding"><i class="bi bi-database-fill-gear me-2"></i>데이터 인제스션</a>
    </nav>
  </div>
  <div class="small px-2 border-top border-dark pt-3">v2.0 Refactored</div>
</div>

<div class="main-chat-area">
  <div class="chat-container" id="knowledgeChatBox">
    <div class="message-row">
      <div class="ai-bubble">
        <div class="mb-2">
          <span class="context-badge"><i class="bi bi-database-check"></i> Elasticsearch 지식 베이스 연동됨</span>
        </div>
        <h4>안녕하세요! 일반 지식 문서 기반 Q&A 시스템입니다.</h4>
        사전에 인제스션된 사내 문서, 가이드라인 및 클라이밍 이론 교본에 기반하여 답변합니다. 궁금한 점을 질문해 주세요.
      </div>
    </div>
  </div>

  <div class="input-wrapper-zone">
    <div class="modern-input-box">
      <textarea id="knowledgeInput" class="inner-textarea" rows="1" placeholder="문서 데이터베이스에 대해 질문하기..."></textarea>
      <button id="sendBtn" class="btn btn-light rounded-circle p-0 d-flex align-items-center justify-content-center" style="width:36px; height:36px; flex-shrink:0;">
        <i class="bi bi-arrow-up-short text-dark fs-4"></i>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/chatbot.js"></script>
</body>
</html>
