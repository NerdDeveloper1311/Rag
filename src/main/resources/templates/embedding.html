<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Knowledge Ingestion Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background-color: #1a1c1e; flex-shrink: 0; }
    .main-panel { flex-grow: 1; padding: 40px; }
  </style>
</head>
<body>
<div class="sidebar p-3 text-secondary">
  <div class="text-white fw-bold fs-5 mb-4 px-2">🧗‍♂️ Climbing RAG Hub</div>
  <nav class="nav flex-column gap-2">
    <a class="nav-link text-muted px-3 py-2" href="/">멀티모달 추천 센터</a>
    <a class="nav-link text-muted px-3 py-2" href="/chatbot">일반 지식 RAG</a>
    <a class="nav-link text-white bg-dark rounded px-3 py-2" href="/admin/embedding">데이터 인제스션</a>
  </nav>
</div>

<div class="main-panel">
  <h3 class="mb-4 fw-bold">⚙️ 지식 인프라 임베딩 콘솔</h3>
  <div class="row g-4">
    <div class="col-md-6">
      <div class="card p-3 shadow-sm mb-3">
        <h5>📝 텍스트 지식 수입</h5>
        <textarea id="plainTextDoc" class="form-control mb-2" rows="4"></textarea>
        <button onclick="commitTextKnowledge()" class="btn btn-primary w-100">텍스트 벡터 빌드</button>
        <div id="textStatus" class="mt-2 text-success small"></div>
      </div>
      <div class="card p-3 shadow-sm">
        <h5>📁 파일 지식 수입 (PDF / TXT)</h5>
        <input type="file" id="binaryFileDoc" class="form-control mb-2">
        <button onclick="commitFileKnowledge()" class="btn btn-success w-100">문서 정제 및 업로드</button>
        <div id="fileStatus" class="mt-2 text-success small"></div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-3 shadow-sm">
        <h5>👟 암벽화 정밀 구조화 명세 주입</h5>
        <input type="text" id="brand" class="form-control mb-2" placeholder="브랜드">
        <input type="text" id="model" class="form-control mb-2" placeholder="모델명">
        <input type="text" id="footShape" class="form-control mb-2" placeholder="족 형">
        <textarea id="footShapeSpec" class="form-control mb-2" rows="3" placeholder="족 형 특이 사항 요약"></textarea>
        <input type="text" id="wallSize" class="form-control mb-2" placeholder="발볼 스케일">
        <input type="text" id="padType" class="form-control mb-2" placeholder="패드 타입">
        <input type="text" id="toeBozSize" class="form-control mb-2" placeholder="토 박스 크기">
        <input type="text" id="heelCupSize" class="form-control mb-2" placeholder="힐 컵 사이즈">
        <input type="text" id="heepCupHardness" class="form-control mb-2" placeholder="힐 컵 단단함">
        <input type="text" id="mainUses" class="form-control mb-2" placeholder="주요 용도">
        <textarea id="desc" class="form-control mb-2" rows="3" placeholder="종합 가이드 설명 문구"></textarea>
        <button onclick="commitShoeKnowledge()" class="btn btn-dark w-100">구조 데이터 인덱싱</button>
        <div id="shoeStatus" class="mt-2 text-success small"></div>
      </div>
    </div>
  </div>
</div>
<script src="/js/embedding.js"></script>
</body>
</html>
