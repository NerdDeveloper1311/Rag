spring:
    application:
        name: rag
    ai:
        ollama:
            base-url: http://localhost:11434
            chat:
                options:
                    model: gemma4:e4b
                    temperature: 0.5
            embedding:
                options:
                    model: bge-m3
        vectorstore:
            elasticsearch:
                initialize-schema: false
                index-name: rag-vector-index
    elasticsearch:
        uris: http://localhost:9200
        username: elastic
        password: 1q2w3e4r
    output:
        ansi:
            enabled: always
    web:
        resources:
            cache:
                cachecontrol:
                    no-cache: true
                    no-store: true
                    must-revalidate: true
    servlet:
        multipart:
            enabled: true
            max-file-size: 50MB
            max-request-size: 50MB
    mvc:
        async:
            request-timeout: -1
logging:
    pattern:
        console: "%clr(%-5level){green} %clr(%logger.%M\\(\\)){cyan}: %msg%n"
management:
    endpoints:
        web:
            exposure:
                include: "metrics"
