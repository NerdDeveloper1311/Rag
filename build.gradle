plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'kr.co.vincent'
version = '0.0.1-SNAPSHOT'
description = 'Rag'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Spring AI 핵심 및 Ollama, Elasticsearch 지원
    implementation 'org.springframework.ai:spring-ai-ollama-spring-boot-starter:1.0.0-M1'
    implementation 'org.springframework.ai:spring-ai-elasticsearch-store-spring-boot-starter:1.0.0-M1'

    // PDF 및 다양한 문서 파싱을 위한 Tika Reader 추가
    implementation 'org.springframework.ai:spring-ai-tika-document-reader:1.0.0-M1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.0.0-M1"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
