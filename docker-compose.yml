services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=32768
    volumes:
      - /d/DockerVolume/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - spring-ai-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: es
    restart: unless-stopped
    ports:
      - "9200:9200"
    entrypoint: >
      bash -c "
        if ! elasticsearch-plugin list | grep -q 'analysis-nori'; then
          elasticsearch-plugin install --batch analysis-nori;
        fi;
        exec /usr/local/bin/docker-entrypoint.sh elasticsearch
      "
    environment:
      - node.name=es
      - cluster.name=es-rag-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=1q2w3e4r
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /d/DockerVolume/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - spring-ai-net

networks:
  spring-ai-net:
    driver: bridge